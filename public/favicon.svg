<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <radialGradient id="bg" cx="40%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#2e1608"/>
      <stop offset="48%"  stop-color="#1b0d04"/>
      <stop offset="100%" stop-color="#0d0602"/>
    </radialGradient>

    <radialGradient id="halo" cx="42%" cy="38%" r="50%">
      <stop offset="0%"   stop-color="#c8862a" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c8862a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="phiGold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#f8e090"/>
      <stop offset="25%"  stop-color="#d4a843"/>
      <stop offset="60%"  stop-color="#c49228"/>
      <stop offset="100%" stop-color="#7a5008"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#d4a843" flood-opacity="0.65" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glowLayer"/>
      <feMerge>
        <feMergeNode in="glowLayer"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Fond -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="256" fill="url(#halo)"/>

  <!-- Anneaux médaillon -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#b8923c" stroke-width="2"   opacity="0.6"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#d4a843" stroke-width="0.8" opacity="0.28"/>

  <!-- Φ rendu comme caractère typographique (police serif système) -->
  <text
    x="256" y="256"
    font-family="'Times New Roman', 'Georgia', 'Palatino Linotype', serif"
    font-size="400"
    font-weight="400"
    text-anchor="middle"
    dominant-baseline="central"
    fill="url(#phiGold)"
    filter="url(#glow)">Φ</text>

</svg>
